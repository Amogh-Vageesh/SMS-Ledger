<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Ledger</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --card-bg: #f5f5f7;
      --border: #e5e5ea;
      --primary: #007aff;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --text: #f5f5f7;
      --card-bg: #1c1c1e;
      --border: #38383a;
      --primary: #0a84ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .status-bar {
      padding: 8px 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    select, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }

    button {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 data-i18n="app_title">SMS Ledger</h1>
    <div class="controls">
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="hi">Hindi</option>
      </select>
    </div>
  </header>

  <div id="syncStatus" class="status-bar" data-i18n="syncing">Connecting...</div>

  <div class="card">
    <h3 data-i18n="dashboard_overview">Overview</h3>
    <p data-i18n="no_transactions">No transactions parsed yet.</p>
  </div>
</div>

<script>
(() => {
  const CATS = [
    ["Food", "#ff9500"],
    ["Shopping", "#5856d6"],
    ["Bills", "#ff2d55"],
    ["Subscriptions", "#af52de"],
    ["Uncategorized", "#8e8e93"]
  ];

  const SUB_WORDS = ["netflix","spotify","hotstar","jiohotstar","prime","youtube","apple","icloud","google","zee5","sonyliv","jiocinema","linkedin","openai","chatgpt","anthropic","claude","adobe","microsoft"];

  const CAT_COLOR = {};
  CATS.forEach(([c, col]) => CAT_COLOR[c] = col);

  // Translation Dictionaries
  const i18n = {
    en: {
      app_title: "SMS Ledger",
      dashboard_overview: "Overview",
      no_transactions: "No transactions parsed yet.",
      syncing: "Synced to your account",
      synced_local: "Synced to cloud and saved locally.",
      local_only: "Saved locally. Could not sync to cloud.",
      failed_sync: "Couldn't sync just now. Your entries are safe on this device."
    },
    es: {
      app_title: "Libro de SMS",
      dashboard_overview: "Resumen",
      no_transactions: "Aún no hay transacciones.",
      syncing: "Sincronizado con su cuenta",
      synced_local: "Sincronizado en la nube y guardado localmente.",
      local_only: "Guardado localmente. No se pudo sincronizar.",
      failed_sync: "No se pudo sincronizar. Sus datos están seguros en este dispositivo."
    },
    hi: {
      app_title: "एसएमएस बहीखाता",
      dashboard_overview: "विवरण",
      no_transactions: "अभी तक कोई लेन-देन नहीं हुआ है।",
      syncing: "आपके खाते के साथ सिंंक किया गया",
      synced_local: "क्लाउड से सिंक किया गया और लोकल सेव किया गया।",
      local_only: "स्थानीय रूप से सहेजा गया। क्लाउड से सिंक नहीं हो सका।",
      failed_sync: "अभी सिंक नहीं हो सका। आपकी जानकारी इस डिवाइस पर सुरक्षित है।"
    }
  };

  let state = {
    txns: [],
    rules: {},
    budgets: {},
    customCats: [],
    monthStart: 1,
    lang: "en",
    theme: "system",
    sims: {}
  };

  let db = null;
  let uid = null;

  function saveLocal() {
    try {
      localStorage.setItem("sms_ledger_state", JSON.stringify(state));
    } catch (e) {}
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem("sms_ledger_state");
      if (raw) state = { ...state, ...JSON.parse(raw) };
      applyCustomCats();
    } catch (e) {}
  }

  function applyCustomCats() {
    if (state.customCats && state.customCats.length) {
      state.customCats.forEach(([c, col]) => {
        CAT_COLOR[c] = col;
      });
    }
  }

  function setStatus(key) {
    const el = document.getElementById("syncStatus");
    if (!el) return;
    const lang = state.lang || "en";
    el.textContent = (i18n[lang] && i18n[lang][key]) ? i18n[lang][key] : key;
  }

  function applyLanguage(lang) {
    state.lang = lang;
    document.documentElement.lang = lang;

    // Update UI elements translated with data-i18n
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (i18n[lang] && i18n[lang][key]) {
        el.textContent = i18n[lang][key];
      }
    });

    const langSelect = document.getElementById("langSelect");
    if (langSelect) langSelect.value = lang;

    saveLocal();
  }

  // Global window handler for select element
  window.changeLanguage = function(lang) {
    applyLanguage(lang);
  };

  async function persist(monthsToSync = [], force = false) {
    saveLocal();
    if (!db || !uid) return;
    try {
      const batch = db.batch();
      const settingsRef = db.doc(`data/users/${uid}/settings`);
      batch.set(settingsRef, {
        rules: state.rules,
        budgets: state.budgets,
        customCats: state.customCats,
        monthStart: state.monthStart,
        lang: state.lang,
        theme: state.theme
      }, { merge: true });

      if (monthsToSync.length > 0) {
        monthsToSync.forEach(m => {
          const monthTxns = state.txns.filter(t => t.date && t.date.startsWith(m));
          const monthRef = db.doc(`data/users/${uid}/month_${m.replace("-", "_")}`);
          batch.set(monthRef, { txns: monthTxns });
        });
      }
      await batch.commit();
      setStatus("synced_local");
    } catch (e) {
      setStatus("local_only");
    }
  }

  async function connectDb() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!d || !u) return;
      const id = await u.id();
      if (!id) return;
      db = d; uid = id;
      const snap = await db.collection("data/users/" + uid).get();
      if (snap.empty) {
        if (state.txns.length || Object.keys(state.rules).length || Object.keys(state.budgets).length) {
          persist([...new Set(state.txns.map(t => t.date.slice(0, 7)))], true);
        } else setStatus("syncing");
      } else {
        let cloudTxns = [];
        snap.docs.forEach(doc => {
          const data = doc.data();
          if (doc.id === "settings") {
            state = { ...state, ...data };
          } else if (data.txns) {
            cloudTxns = cloudTxns.concat(data.txns);
          }
        });
        if (cloudTxns.length) {
          state.txns = cloudTxns;
        }
        saveLocal();
        applyLanguage(state.lang || "en");
        setStatus("syncing");
      }
    } catch (e) {
      setStatus("failed_sync");
    }
  }

  // Initialization
  loadLocal();
  applyLanguage(state.lang || "en");
  connectDb();
})();
</script>
</body>
</html>
